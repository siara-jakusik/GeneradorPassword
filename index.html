<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generate Password</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="titulo">
        <h1>Generador de password</h1>
      </div>
      <div class="resultado">
        <input type="text" id="resultadoInput" readonly />
        <button id="copiar">📋</button>
      </div>
      <div class="configuracion">
        <div class="opciones">
          <label>Tamaño de la contraseña</label>
          <input
            type="number"
            id="longitudInput"
            value="8"
            min="1"
            max="20"
            step="1"
          />
        </div>
        <div class="opciones">
          <label> Se incluyen mayusculas</label>
          <input type="checkbox" id="mayusculas" />
        </div>
        <div class="opciones">
          <label> Se incluyen minusculas </label>
          <input type="checkbox" id="minusculas" />
        </div>
        <div class="opciones">
          <label> Se incluyen numeros </label>
          <input type="checkbox" id="numeros" />
        </div>
        <div class="opciones">
          <label> Se incluyen simbolos </label>
          <input type="checkbox" id="simbolos" />
        </div>
      </div>
      <div class="generar">
        <button id="generar">Generate Password</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
